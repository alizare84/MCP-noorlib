[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noorlib-mcp"
dynamic = ["version"]
description = "عرش الرحمان — unified MCP server for the seven Noor-family sites: noorlib.ir, hadith.inoor.ir, quran.inoor.ir, wikinoor.ir, qamus.inoor.ir, noordoc.ir, tarikh.inoor.ir"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "noorlib-mcp contributors" }]
keywords = [
    "mcp", "noorlib", "noor", "arsh", "arsh-alrahman", "islamic",
    "hadith", "quran", "tafsir", "library", "wikinoor", "qamus",
    "noordoc", "tarikh",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/alizare84/MCP-noorlib"
Source = "https://github.com/alizare84/MCP-noorlib"
Issues = "https://github.com/alizare84/MCP-noorlib/issues"

[project.scripts]
# ALL names install the same entry point so any mcp.json works:
#   "command": ".../.venv/bin/noor-mcp"      <- short name
#   "command": ".../.venv/bin/noorlib-mcp"   <- original name
#   "command": ".../.venv/bin/arsh-alrahman" <- project name (عرش الرحمان)
noor-mcp = "noorlib_mcp.server:main"
noorlib-mcp = "noorlib_mcp.server:main"
arsh-alrahman = "noorlib_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.version]
path = "noorlib_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["noorlib_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E501 is ignored: Persian/Arabic text and long URLs are not wrapped by design
select = ["E", "F", "W", "I"]
ignore = ["E501"]
